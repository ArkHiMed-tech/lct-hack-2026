services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ASR_HOST=asr_service
      - RAC_HOST=rac_service
      - TTS_HOST=tts_service
    depends_on:
      - asr_service
      - rac_service
      - tts_service
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  asr_service:
    build:
      context: .
      dockerfile: asr_service/Dockerfile
    expose:
      - "50051"
    volumes:
      - ~/.cache/torch:/root/.cache/torch
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  rac_service:
    build:
      context: .
      dockerfile: rac_service/Dockerfile
    expose:
      - "50052"
    volumes:
      - ./rac_service/knowledge_base.index:/app/knowledge_base.index
      - ./rac_service/knowledge_base_processed.json:/app/knowledge_base.json
      - ~/.cache/torch:/root/.cache/torch
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G

  tts_service:
    build:
      context: .
      dockerfile: tts_service/Dockerfile
    expose:
      - "50053"
    volumes:
      - ~/.cache/torch:/root/.cache/torch
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  client:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./client:/usr/share/nginx/html:ro