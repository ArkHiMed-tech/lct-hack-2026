<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Эмулятор телефонного разговора</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; text-align: center; }
        #status { font-size: 18px; margin: 20px 0; padding: 20px; border-radius: 10px; }
        .listening { background: #e3f2fd; }
        .speaking { background: #fff3e0; }
        .idle { background: #f5f5f5; }
        button { padding: 15px 30px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; }
        #startBtn { background: #4caf50; color: white; }
        #stopBtn { background: #f44336; color: white; display: none; }
        #transcript { margin-top: 20px; padding: 15px; background: #fafafa; border-radius: 5px; min-height: 100px; text-align: left; }
    </style>
</head>
<body>
    <h1>📞 Эмулятор телефонного разговора</h1>
    <div id="status" class="idle">Нажмите "Начать звонок"</div>
    <button id="startBtn" onclick="startCall()">Начать звонок</button>
    <button id="stopBtn" onclick="stopCall()">Завершить</button>
    <div id="transcript"></div>
    
    <script src="app.js"></script>
</body>
</html>
